<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gridfeed</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0f14; --panel: #121821; --panel2: #18202b; --line: #243040; --text: #e6edf3; --muted: #8b98a8; --faint: #5d6b7c;
  --good: #3fb950; --good-bg: rgba(63,185,80,.13); --sus: #f0b429; --sus-bg: rgba(240,180,41,.14); --bad: #f47067; --bad-bg: rgba(244,112,103,.14);
  --info: #58a6ff; --info-bg: rgba(88,166,255,.13); --model: #a78bfa; --accent: #7ee2a8;
}
:root[data-theme="light"] {
  --bg: #f6f8fa; --panel: #fff; --panel2: #f0f3f6; --line: #d8dee4; --text: #1f2328; --muted: #57606a; --faint: #8c959f;
  --good: #1a7f37; --good-bg: #dafbe1; --sus: #9a6700; --sus-bg: #fff8c5; --bad: #cf222e; --bad-bg: #ffebe9; --info: #0969da; --info-bg: #ddf4ff; --model: #8250df; --accent: #1a7f37;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13.5px/1.45 Inter, system-ui, sans-serif; }
.mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
header { display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
header h1 { margin: 0; font-size: 17px; font-weight: 700; } header h1 span { color: var(--accent); }
header .sub { color: var(--muted); font-size: 13px; }
.pills { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.pill { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); color: var(--muted); }
.pill b { color: var(--text); }
main { display: grid; grid-template-columns: 290px minmax(420px, 1fr) 400px; height: calc(100% - 54px); }
main > section { overflow: auto; padding: 14px; }
main > section + section { border-left: 1px solid var(--line); }
.h { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 600; margin: 4px 2px 8px; display: flex; justify-content: space-between; }
.integ { margin-bottom: 14px; }
.integ .name { font-weight: 600; font-size: 12.5px; color: var(--muted); margin: 0 2px 6px; }
.dev { display: block; width: 100%; text-align: left; font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; }
.dev:hover { border-color: var(--faint); } .dev.on { border-color: var(--accent); }
.dev .t { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.live { background: var(--good); box-shadow: 0 0 0 3px var(--good-bg); } .dot.quiet { background: var(--sus); box-shadow: 0 0 0 3px var(--sus-bg); } .dot.waiting { background: var(--faint); }
.dev .s { color: var(--muted); font-size: 12px; margin-top: 3px; display: flex; justify-content: space-between; gap: 6px; }
.chip { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.chip.g0 { color: var(--good); background: var(--good-bg); } .chip.g1 { color: var(--sus); background: var(--sus-bg); } .chip.g2 { color: var(--bad); background: var(--bad-bg); }
.chip.info { color: var(--info); background: var(--info-bg); } .chip.quiet { color: var(--sus); background: var(--sus-bg); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
.title { font-size: 16px; font-weight: 600; margin: 2px 0 2px; } .meta { color: var(--muted); font-size: 12px; }
svg text { fill: var(--faint); font: 10.5px Inter, sans-serif; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 5px; border-radius: 2px; }
.issue { border-top: 1px solid var(--line); padding: 8px 0; } .issue:first-of-type { border-top: 0; padding-top: 0; }
.issue .t { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-weight: 600; font-size: 12.5px; }
.issue .d { color: var(--muted); font-size: 12px; margin-top: 2px; }
.issue .w { color: var(--faint); font-size: 11.5px; margin-top: 2px; }
.issue.closed { opacity: .62; }
.stage { font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); }
.ev { border-left: 3px solid var(--bad); padding: 4px 0 4px 9px; margin: 6px 0; font-size: 12.5px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; } td, th { text-align: left; padding: 4px 4px; border-top: 1px solid var(--line); } th { color: var(--faint); font-weight: 600; }
@media (max-width: 1150px) { main { grid-template-columns: 1fr; height: auto; } main > section + section { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>grid<span>feed</span></h1>
  <div class="sub">Measurement integration for a grid digital twin · MQTT, IEC 104 and batch into TimescaleDB, checked against the grid model</div>
  <div class="pills" id="pills"></div>
</header>
<main>
  <section id="left"></section>
  <section id="mid"><div class="meta">Loading…</div></section>
  <section id="right"></section>
</main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const GRADE = ["good", "suspect", "bad"];
const CHECK = {
  frozen: "Frozen value", implausible: "Implausible value", step: "Sudden step", gap: "Missing readings", duplicate: "Duplicate readings",
  out_of_order: "Out of order", source_invalid: "Device: invalid (IV)", source_not_topical: "Device: not topical (NT)",
  unmapped_channel: "Unmapped channel", missing_channel: "Missing channel", unknown_device: "Unknown device", unknown_asset: "Unknown asset",
  voltage_level: "Wrong voltage level", model_voltage: "Voltage disagrees with grid model", current_consistency: "Current inconsistent",
  mapping_fingerprint: "Mapped to the wrong transformer?", overload_unconfirmed: "Overload on untrusted data",
};
const ts = t => t ? t.slice(5, 16).replace("T", " ") : "";
let O = null, I = [], E = [], R = [], sel = new URLSearchParams(location.search).get("device");

function pills() {
  const t = O.totals;
  setHTML("pills",
    `<span class="pill"><b>${t.values.toLocaleString()}</b> graded values</span>` +
    `<span class="pill"><b>${t.open_issues}</b> open issues · <b>${t.closed_issues}</b> closed</span>` +
    `<span class="pill"><b>${t.events}</b> grid events</span>`);
}

function left() {
  const by = {};
  O.devices.forEach(d => (by[d.integration] ||= []).push(d));
  let h = `<div class="h">Integrations</div>`;
  for (const [key, label] of Object.entries(O.integrations)) {
    if (!by[key]) continue;
    h += `<div class="integ"><div class="name">${esc(label)}</div>` + by[key].map(d => `
      <button class="dev ${d.device === sel ? "on" : ""}" data-d="${esc(d.device)}">
        <div class="t"><span class="dot ${d.state}"></span>${esc(d.device)}
          <span style="margin-left:auto">${d.state === "quiet" ? `<span class="chip quiet">quiet ${Math.round(d.silent_s)}s</span>` : d.open_issues ? `<span class="chip g${d.worst}">${d.open_issues} open</span>` : `<span class="chip g0">ok</span>`}</span></div>
        <div class="s"><span>${esc(d.station || "")} · ${d.rating_kva ?? "?"} kVA · ${d.messages} msgs</span><span class="mono">${ts(d.last_ts)}</span></div>
      </button>`).join("") + `</div>`;
  }
  setHTML("left", h);
}

// One handler on the container, so clicks survive the periodic re-render.
document.getElementById("left").addEventListener("click", e => {
  const b = e.target.closest("[data-d]");
  if (!b) return;
  sel = b.dataset.d;
  history.replaceState(null, "", "?device=" + encodeURIComponent(sel));
  left(); loadSeries();
});

const last = {};
function setHTML(id, html) {  // skip the DOM work when nothing changed
  if (last[id] === html) return;
  last[id] = html;
  document.getElementById(id).innerHTML = html;
}

function chart(points, key, { h = 170, unit = "", ref = null, model = false, fmt = v => v.toFixed(1) } = {}) {
  const pts = points.filter(p => p[key]);
  if (!pts.length) return `<div class="meta">No data yet.</div>`;
  const W = 760, P = { l: 44, r: 10, t: 10, b: 22 };
  const t0 = new Date(pts[0].ts).getTime(), t1 = Math.max(new Date(pts.at(-1).ts).getTime(), t0 + 1);
  let vals = pts.map(p => p[key].v); if (model) vals = vals.concat(pts.filter(p => p.expected_voltage).map(p => p.expected_voltage));
  if (ref !== null) vals.push(ref);
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo || 1) * 0.08; lo -= pad; hi += pad;
  const x = t => P.l + (new Date(t).getTime() - t0) / (t1 - t0) * (W - P.l - P.r);
  const y = v => P.t + (1 - (v - lo) / (hi - lo)) * (h - P.t - P.b);
  const col = ["var(--good)", "var(--sus)", "var(--bad)"];
  let segs = "";
  for (let k = 1; k < pts.length; k++) {
    const a = pts[k - 1], b = pts[k], g = Math.max(a[key].g, b[key].g);
    const gapped = new Date(b.ts) - new Date(a.ts) > 31 * 60000;
    segs += `<line x1="${x(a.ts)}" y1="${y(a[key].v)}" x2="${x(b.ts)}" y2="${y(b[key].v)}" stroke="${gapped ? "var(--faint)" : col[g]}" stroke-width="${g ? 2.2 : 1.6}" ${gapped ? 'stroke-dasharray="2 3"' : ""}/>`;
  }
  let modelLine = "";
  if (model) {
    const mp = pts.filter(p => p.expected_voltage);
    modelLine = `<polyline fill="none" stroke="var(--model)" stroke-width="1.2" stroke-dasharray="4 3" points="${mp.map(p => `${x(p.ts)},${y(p.expected_voltage)}`).join(" ")}"/>`;
  }
  const refLine = ref === null ? "" : `<line x1="${P.l}" x2="${W - P.r}" y1="${y(ref)}" y2="${y(ref)}" stroke="var(--bad)" stroke-dasharray="3 3" opacity=".7"/><text x="${W - P.r - 2}" y="${y(ref) - 4}" text-anchor="end">${fmt(ref)}${unit}</text>`;
  const ticks = [lo + pad, (lo + hi) / 2, hi - pad].map(v => `<text x="${P.l - 6}" y="${y(v) + 3}" text-anchor="end">${fmt(v)}</text><line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" opacity=".5"/>`).join("");
  const days = []; for (const p of pts) { const d = p.ts.slice(0, 10); if (!days.includes(d)) days.push(d); }
  const dl = days.map(d => { const t = new Date(d + "T00:00:00Z").getTime(); return t >= t0 ? `<text x="${x(d + "T00:00:00Z")}" y="${h - 6}">${d.slice(5)}</text>` : ""; }).join("");
  return `<svg viewBox="0 0 ${W} ${h}" width="100%">${ticks}${refLine}${modelLine}${segs}${dl}</svg>`;
}

async function loadSeries() {
  if (!sel) return;
  const s = await (await fetch(`/api/series/${encodeURIComponent(sel)}`)).json();
  const d = O.devices.find(x => x.device === sel) || {};
  const mine = I.filter(i => i.device === sel);
  const ev = E.filter(e => e.device === sel);
  setHTML("mid", `
    <div class="meta">${esc(O.integrations[d.integration] || "")}</div>
    <div class="title">${esc(sel)} → ${esc(s.asset)}</div>
    <div class="meta">Station ${esc(d.station || "")} · transformer ${s.rating_kva} kVA, 20/0.4 kV · ${s.points.length} readings</div>
    <div class="card" style="margin-top:12px"><div class="h">Busbar voltage <span>measured vs. predicted from the grid model</span></div>
      ${chart(s.points, "voltage", { model: true, unit: " V" })}
      <div class="legend"><span><i style="background:var(--good)"></i>measured, good</span><span><i style="background:var(--sus)"></i>suspect</span><span><i style="background:var(--bad)"></i>bad</span><span><i style="background:var(--model)"></i>model: voltage for the measured P and Q</span><span><i style="background:var(--faint)"></i>no data</span></div></div>
    <div class="card"><div class="h">Transformer loading <span>derived; inherits the worst grade of P and Q</span></div>
      ${chart(s.points, "loading", { ref: 100, unit: "%", fmt: v => v.toFixed(0) })}
      ${ev.length ? ev.map(e => `<div class="ev"><b>Overload</b> ${ts(e.start_ts)} to ${ts(e.end_ts).slice(6)} · peak ${e.peak.toFixed(0)}% · ${esc(e.detail)}</div>`).join("") : `<div class="meta">No overload raised on trusted data.</div>`}</div>
    <div class="card"><div class="h">Issues for this device <span>${mine.filter(i => i.status === "open").length} open</span></div>${issueList(mine) || '<div class="meta">None.</div>'}</div>`);
}

function issueList(list) {
  return list.map(i => `<div class="issue ${i.status}">
    <div class="t"><span class="stage">S${i.stage}</span>${esc(CHECK[i.check_name] || i.check_name)}${i.quantity ? ` <span class="meta" style="font-weight:400">${esc(i.quantity.replace("_", " "))}</span>` : ""}
      <span class="chip ${i.check_name === "gap" || i.check_name === "unmapped_channel" ? "info" : "g" + i.grade}">${i.check_name === "gap" || i.check_name === "unmapped_channel" ? "info" : GRADE[i.grade]}</span>
      <span class="meta" style="margin-left:auto;font-weight:400">${esc(i.device)}</span></div>
    <div class="d">${esc(i.detail)}</div>
    <div class="w">${ts(i.first_seen)} → ${ts(i.last_seen)} · ${i.occurrences}× · ${i.status === "open" ? "open" : "closed: " + esc(i.closed_reason)}</div></div>`).join("");
}

function right() {
  const open = I.filter(i => i.status === "open"), closed = I.filter(i => i.status === "closed");
  setHTML("right", `
    <div class="h">Grid events <span>raised only on trusted data</span></div>
    <div class="card">${E.length ? E.map(e => `<div class="ev"><b>${esc(e.device)}</b> overload ${ts(e.start_ts)} to ${ts(e.end_ts).slice(6)}, peak ${e.peak.toFixed(0)}%<div class="meta">${esc(e.detail)}</div></div>`).join("") : '<div class="meta">None yet.</div>'}</div>
    <div class="h">Issue log <span>${open.length} open · ${closed.length} closed</span></div>
    <div class="card">${issueList(open.concat(closed)) || '<div class="meta">No issues.</div>'}</div>
    ${R.length ? `<div class="h">Batch imports</div><div class="card"><table><tr><th>#</th><th>file</th><th>rows</th><th>opened</th><th>closed</th></tr>${R.map(r => `<tr><td>${r.id}</td><td class="mono">${esc(r.source)}</td><td>${r.rows_in}</td><td>${r.issues_opened}</td><td>${r.issues_closed}</td></tr>`).join("")}</table></div>` : ""}`);
}

async function tick() {
  [O, I, E, R] = await Promise.all(["/api/overview", "/api/issues", "/api/events", "/api/imports"].map(u => fetch(u).then(r => r.json())));
  if (!sel && O.devices.length) sel = O.devices[0].device;
  pills(); left(); right(); await loadSeries();
}
tick(); setInterval(tick, 1500);
</script>
</body>
</html>
